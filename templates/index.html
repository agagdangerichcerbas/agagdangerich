
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f3ff;
            color: #333;
        }

        h1, h2 {
            color: #6a5acd;
        }

        h1 {
            text-align: center;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            background: #6a5acd;
            color: white;
            border: none;
            border-radius: 6px;
        }

        button:hover {
            background: #5144a5;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #result,
        #greeting,
        #studentsResult {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .student-card {
            padding: 12px;
            margin-bottom: 12px;
            background: #faf9ff;
            border: 1px solid #d8d0ff;
            border-radius: 6px;
        }

        .student-card p {
            margin: 7px 0;
        }

        hr {
            margin: 30px 0;
            border: none;
            border-top: 1px solid #ddd;
        }

        .status {
            color: #5144a5;
        }
    </style>
</head>

<body>

    <h1>Student API Interface</h1>

    <!-- STUDENT INFORMATION -->
    <h2>Student Information</h2>

    <button onclick="loadStudent()">
        Load Student Information
    </button>

    <div id="result">
        Click the button to load student information.
    </div>

    <hr>

    <!-- GREETING API -->
    <h2>Greeting API</h2>

    <input
        type="text"
        id="nameInput"
        placeholder="Enter your first name"
    >

    <button onclick="sayHello()">Say Hello</button>

    <div id="greeting">
        Enter your name and click Say Hello.
    </div>

    <hr>

    <!-- STUDENTS API -->
    <h2>Students API</h2>

    <p>
        Click below to retrieve student records from the Flask database.
    </p>

    <button onclick="loadStudents()">Load Students</button>

    <div id="studentsResult">
        Click Load Students to display student records.
    </div>

    <script>
        // Helper function for API requests
        async function fetchJSON(url) {
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error("Request failed: " + response.status);
            }

            return await response.json();
        }

        // LOAD ONE STUDENT
        async function loadStudent() {
            const result = document.getElementById("result");

            result.textContent = "Loading student information...";

            try {
                const data = await fetchJSON("/student");

                result.replaceChildren();

                const fields = [
                    ["Student ID", data.student_id],
                    ["Name", data.name],
                    ["Program", data.program],
                    ["Year", data.year],
                    ["Section", data.section]
                ];

                fields.forEach(([label, value]) => {
                    const p = document.createElement("p");
                    const b = document.createElement("b");

                    b.textContent = label + ": ";
                    p.appendChild(b);
                    p.appendChild(
                        document.createTextNode(value ?? "N/A")
                    );

                    result.appendChild(p);
                });
            } catch (error) {
                result.textContent =
                    "Unable to retrieve student information.";
                console.error(error);
            }
        }

        // GREETING API
        async function sayHello() {
            const name = document
                .getElementById("nameInput")
                .value
                .trim();

            const greeting = document.getElementById("greeting");

            if (!name) {
                greeting.textContent = "Please enter your name first.";
                return;
            }

            greeting.textContent = "Loading greeting...";

            try {
                const data = await fetchJSON(
                    "/hello?name=" + encodeURIComponent(name)
                );

                greeting.textContent =
                    data.message ?? "Greeting received.";
            } catch (error) {
                greeting.textContent = "Unable to retrieve greeting.";
                console.error(error);
            }
        }

        // LOAD MULTIPLE STUDENTS
        async function loadStudents() {
            const container =
                document.getElementById("studentsResult");

            container.textContent = "Loading student records...";

            try {
                const data = await fetchJSON("/students");

                const students = Array.isArray(data)
                    ? data
                    : data.students;

                if (!Array.isArray(students)) {
                    throw new Error(
                        "Unexpected students API response format"
                    );
                }

                container.replaceChildren();

                if (students.length === 0) {
                    container.textContent = "No student records found.";
                    return;
                }

                students.forEach(student => {
                    const card = document.createElement("div");
                    card.className = "student-card";

                    const fields = [
                        ["Student ID", student.student_id],
                        ["Name", student.name],
                        ["Program", student.program],
                        ["Year", student.year],
                        ["Section", student.section]
                    ];

                    fields.forEach(([label, value]) => {
                        const p = document.createElement("p");
                        const b = document.createElement("b");

                        b.textContent = label + ": ";
                        p.appendChild(b);
                        p.appendChild(
                            document.createTextNode(value ?? "N/A")
                        );

                        card.appendChild(p);
                    });

                    container.appendChild(card);
                });
            } catch (error) {
                container.textContent =
                    "Unable to retrieve student records.";
                console.error("Students API error:", error);
            }
        }
    </script>

</body>
</html>
